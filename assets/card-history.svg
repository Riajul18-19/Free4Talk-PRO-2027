<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="270">
  <defs>
    <linearGradient id="bgHis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="glassHis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.16)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.18)" />
    </linearGradient>

    <linearGradient id="borderHis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.85)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.45)" />
    </linearGradient>

    <linearGradient id="titleHisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#818cf8;#ffffff;#38bdf8" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#818cf8;#ffffff;#38bdf8;#c084fc" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="softGlowHis">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#818cf8" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes orbitRing1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes orbitRing2 { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes pulseCore { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } }
      .ring-orbit-1 { transform-origin: 85px 135px; animation: orbitRing1 14s linear infinite; will-change: transform; }
      .ring-orbit-2 { transform-origin: 85px 135px; animation: orbitRing2 20s linear infinite; will-change: transform; }
      .pulse-core-node { transform-origin: 85px 135px; animation: pulseCore 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="880" height="270" rx="20" fill="url(#bgHis)" />
  <rect x="15" y="15" width="850" height="240" rx="18" fill="url(#glassHis)" stroke="url(#borderHis)" stroke-width="1.2" filter="url(#softGlowHis)" />

  <!-- Circle Animation: Concentric Orbiting Data Rings -->
  <g id="storage-circle-group">
    <circle cx="85" cy="135" r="54" fill="rgba(14, 165, 233, 0.05)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    
    <!-- Outer Orbit with Satellite Dot -->
    <g class="ring-orbit-1">
      <circle cx="85" cy="135" r="46" fill="none" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" stroke-dasharray="8 6" />
      <circle cx="85" cy="89" r="4.5" fill="#38bdf8" />
      <circle cx="85" cy="181" r="3.5" fill="#818cf8" />
    </g>

    <!-- Inner Orbit with Satellite Dot -->
    <g class="ring-orbit-2">
      <circle cx="85" cy="135" r="30" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5" stroke-dasharray="14 8" />
      <circle cx="115" cy="135" r="4" fill="#c084fc" />
    </g>

    <!-- Glowing Core -->
    <circle class="pulse-core-node" cx="85" cy="135" r="16" fill="rgba(99, 102, 241, 0.3)" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="85" cy="135" r="7" fill="#ffffff" />
  </g>

  <!-- Header with Color Changing Title -->
  <g transform="translate(170, 52)">
    <rect x="0" y="-18" width="85" height="20" rx="10" fill="rgba(129, 140, 248, 0.2)" stroke="#818cf8" stroke-width="0.8" />
    <text x="42" y="-4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a5b4fc" text-anchor="middle">PERSISTENCE</text>
    <text x="96" y="-4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">LOCAL DATA ARCHIVE ENGINE</text>

    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="900" fill="url(#titleHisGrad)" letter-spacing="-0.02em">
      Permanent DM History &amp; 200 Saved Room Chats
    </text>
  </g>

  <!-- Two Column Content Breakdown -->
  <g transform="translate(170, 115)">
    <!-- Column 1: Permanent DM History -->
    <g>
      <rect x="0" y="0" width="320" height="116" rx="12" fill="rgba(2, 6, 23, 0.45)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">PERMANENT DM HISTORY (PRO)</text>
      
      <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Bypasses Free4Talk's 7-day automatic deletion permanently</text>
      <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Scroll up in any chat to view older saved messages continuously</text>
      <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Retains original copies if someone deletes a message afterward</text>
      <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• 100% on your device: zero cloud telemetry or server uploads</text>
    </g>

    <!-- Column 2: Saved Chats -->
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="330" height="116" rx="12" fill="rgba(2, 6, 23, 0.45)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#c084fc">SAVED ROOM CHATS (PRO)</text>
      
      <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Automatically archives room messages from up to 200 rooms</text>
      <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Real-time keyword search across speaker names &amp; text</text>
      <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• One-click instant restore: reload old talks without refreshing</text>
      <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#34d399">✓ Powered by IndexedDB Schema v3: zero room crashes</text>
    </g>
  </g>
</svg>
