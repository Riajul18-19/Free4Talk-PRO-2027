<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="430">
  <defs>
    <linearGradient id="bgComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f192f" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="glassComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.18)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.12)" />
    </linearGradient>

    <linearGradient id="borderComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.85)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.4)" />
    </linearGradient>

    <linearGradient id="titleCompGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#f59e0b;#818cf8;#34d399;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#818cf8;#34d399;#38bdf8;#f59e0b" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="softGlowComp">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#0ea5e9" flood-opacity="0.45" />
    </filter>

    <style>
      @keyframes spinGear { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .gear-spin { transform-origin: 52px 42px; animation: spinGear 12s linear infinite; will-change: transform; }
    </style>
  </defs>

  <rect width="880" height="430" rx="22" fill="url(#bgComp)" />
  <rect x="15" y="15" width="850" height="400" rx="20" fill="url(#glassComp)" stroke="url(#borderComp)" stroke-width="1.3" filter="url(#softGlowComp)" />

  <!-- Header Section with Circle Animation -->
  <g transform="translate(30, 25)">
    <!-- Rotating Circular Icon -->
    <g class="gear-spin">
      <circle cx="52" cy="42" r="22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
      <circle cx="52" cy="42" r="14" fill="rgba(14, 165, 233, 0.25)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="52" cy="42" r="5" fill="#f59e0b" />
    </g>

    <g transform="translate(90, 24)">
      <rect x="0" y="-8" width="92" height="20" rx="6" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="0.8" />
      <text x="46" y="6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="900" fill="#fbbf24" text-anchor="middle">TIER MATRIX</text>
      <text x="104" y="6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">FEATURE BREAKDOWN &amp; VALUE COMPARISON</text>

      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="900" fill="url(#titleCompGrad)" letter-spacing="-0.02em">
        Free4Talk Pro V27 vs Default Free4Talk
      </text>
    </g>
  </g>

  <!-- Table Headers -->
  <g transform="translate(35, 105)">
    <rect x="0" y="0" width="810" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="20" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">CAPABILITY</text>
    <text x="410" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#f87171" text-anchor="middle">DEFAULT FREE4TALK</text>
    <text x="590" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">OLD EXTENSION</text>
    <text x="730" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#38bdf8" text-anchor="middle">PRO V27 (2027)</text>
  </g>

  <!-- Rows -->
  <!-- Row 1: macOS UI Blur -->
  <g transform="translate(35, 145)">
    <rect x="0" y="0" width="810" height="32" rx="6" fill="rgba(255, 255, 255, 0.03)" />
    <text x="20" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">macOS Acrylic Frosted Blur &amp; Traffic Lights</text>
    <text x="410" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">❌ None</text>
    <text x="590" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">❌ None</text>
    <text x="730" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">✅ Full macOS Glass</text>
  </g>

  <!-- Row 2: User Profile Insights -->
  <g transform="translate(35, 181)">
    <rect x="0" y="0" width="810" height="32" rx="6" fill="rgba(14, 165, 233, 0.05)" />
    <text x="20" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">User Profile Insights (Languages, Topics, Partners)</text>
    <text x="410" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">❌ None</text>
    <text x="590" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#fbbf24" text-anchor="middle">⚠️ API Key Needed</text>
    <text x="730" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">✅ 100% Unlocked</text>
  </g>

  <!-- Row 3: YouTube Room Streamer -->
  <g transform="translate(35, 217)">
    <rect x="0" y="0" width="810" height="32" rx="6" fill="rgba(255, 255, 255, 0.03)" />
    <text x="20" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Direct YouTube Room Streaming (No Local Echo)</text>
    <text x="410" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">❌ None</text>
    <text x="590" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#f87171" text-anchor="middle">🔒 Paywalled</text>
    <text x="730" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">✅ 100% Unlocked</text>
  </g>

  <!-- Row 4: Spotify Player -->
  <g transform="translate(35, 253)">
    <rect x="0" y="0" width="810" height="32" rx="6" fill="rgba(14, 165, 233, 0.05)" />
    <text x="20" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Spotify Library Player &amp; Cover Art Sync</text>
    <text x="410" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">❌ None</text>
    <text x="590" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#f87171" text-anchor="middle">🔒 Paywalled</text>
    <text x="730" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#1ed760" text-anchor="middle">✅ 100% Unlocked</text>
  </g>

  <!-- Row 5: Permanent DM History -->
  <g transform="translate(35, 289)">
    <rect x="0" y="0" width="810" height="32" rx="6" fill="rgba(255, 255, 255, 0.03)" />
    <text x="20" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Permanent DM History (Past Free4Talk's 7-Day Limit)</text>
    <text x="410" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#f87171" text-anchor="middle">❌ 7-Day Purge</text>
    <text x="590" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#f87171" text-anchor="middle">🔒 Paywalled</text>
    <text x="730" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#818cf8" text-anchor="middle">✅ Infinite Local</text>
  </g>

  <!-- Row 6: Saved Room Chats -->
  <g transform="translate(35, 325)">
    <rect x="0" y="0" width="810" height="32" rx="6" fill="rgba(14, 165, 233, 0.05)" />
    <text x="20" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Saved Room Chats (Searchable Archive)</text>
    <text x="410" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#f87171" text-anchor="middle">❌ Erased on Exit</text>
    <text x="590" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#f87171" text-anchor="middle">🔒 Paywalled</text>
    <text x="730" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#c084fc" text-anchor="middle">✅ 200 Rooms Stored</text>
  </g>

  <!-- Row 7: Spam Bot Kicker & SponsorBlock -->
  <g transform="translate(35, 361)">
    <rect x="0" y="0" width="810" height="32" rx="6" fill="rgba(255, 255, 255, 0.03)" />
    <text x="20" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Spam Bot Auto-Kicker &amp; SponsorBlock Non-Music Skip</text>
    <text x="410" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">❌ None</text>
    <text x="590" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#34d399" text-anchor="middle">✅ Basic</text>
    <text x="730" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">✅ Auto Active</text>
  </g>
</svg>
