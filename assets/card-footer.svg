<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="160">
  <defs>
    <linearGradient id="bgFoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <linearGradient id="glassFoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.14)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.1)" />
    </linearGradient>

    <linearGradient id="borderFoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.7)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.4)" />
    </linearGradient>

    <linearGradient id="titleFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#38bdf8;#818cf8;#34d399;#ffffff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#ffffff;#38bdf8" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <style>
      @keyframes spinFootRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .foot-ring { transform-origin: 65px 80px; animation: spinFootRing 16s linear infinite; will-change: transform; }
    </style>
  </defs>

  <rect width="880" height="160" rx="20" fill="url(#bgFoot)" />
  <rect x="15" y="15" width="850" height="130" rx="18" fill="url(#glassFoot)" stroke="url(#borderFoot)" stroke-width="1.2" />

  <!-- Logo with Rotating Circle Animation -->
  <g id="footer-logo-group">
    <g class="foot-ring">
      <circle cx="65" cy="80" r="32" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" stroke-dasharray="8 6" />
      <circle cx="65" cy="48" r="4" fill="#38bdf8" />
      <circle cx="65" cy="112" r="3" fill="#818cf8" />
    </g>

    <!-- Center Badge -->
    <rect x="43" y="58" width="44" height="44" rx="12" fill="#0ea5e9" stroke="#ffffff" stroke-width="1" />
    <text x="65" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">PRO</text>
  </g>

  <!-- Center Text Content -->
  <g transform="translate(130, 48)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="19" font-weight="900" fill="url(#titleFootGrad)" letter-spacing="-0.02em">
      Free4Talk Pro V27 — 2027 Edition
    </text>
    
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">
      Independent Community Project • Built with macOS Acrylic Glass Vibrancy • Distributed under MIT License
    </text>

    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">
      Skip Data: SponsorBlock (CC BY-NC-SA 4.0) • Unofficial Tool: Not affiliated with Free4Talk, Spotify, or YouTube
    </text>
  </g>

  <!-- Right Badges -->
  <g transform="translate(680, 52)">
    <rect x="0" y="0" width="145" height="26" rx="13" fill="rgba(14, 165, 233, 0.2)" stroke="#38bdf8" stroke-width="0.8" />
    <text x="72" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle">⚡ 100% UNLOCKED</text>

    <rect x="0" y="34" width="145" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="0.8" />
    <text x="72" y="51" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">v27.0.0 RELEASE</text>
  </g>
</svg>
