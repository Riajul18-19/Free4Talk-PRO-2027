<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="270">
  <defs>
    <linearGradient id="bgMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="glassMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.18)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.12)" />
    </linearGradient>

    <linearGradient id="borderMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.85)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.4)" />
    </linearGradient>

    <linearGradient id="titleMedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#34d399;#818cf8;#ffffff;#38bdf8" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#818cf8;#ffffff;#38bdf8;#34d399" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="softGlowMed">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes spinVinyl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes eqBounce1 { 0%, 100% { height: 8px; } 50% { height: 26px; } }
      @keyframes eqBounce2 { 0%, 100% { height: 24px; } 50% { height: 10px; } }
      @keyframes eqBounce3 { 0%, 100% { height: 14px; } 50% { height: 30px; } }
      .vinyl-spin { transform-origin: 85px 135px; animation: spinVinyl 8s linear infinite; will-change: transform; }
      .eq-1 { animation: eqBounce1 1.1s ease-in-out infinite; }
      .eq-2 { animation: eqBounce2 0.8s ease-in-out infinite 0.2s; }
      .eq-3 { animation: eqBounce3 1.3s ease-in-out infinite 0.4s; }
    </style>
  </defs>

  <rect width="880" height="270" rx="20" fill="url(#bgMed)" />
  <rect x="15" y="15" width="850" height="240" rx="18" fill="url(#glassMed)" stroke="url(#borderMed)" stroke-width="1.2" filter="url(#softGlowMed)" />

  <!-- Circle Animation: Spinning Vinyl Record & Equalizer -->
  <g id="vinyl-disc-group">
    <circle cx="85" cy="135" r="54" fill="#0b0f19" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <!-- Grooves -->
    <g class="vinyl-spin">
      <circle cx="85" cy="135" r="46" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.8" stroke-dasharray="8 4" />
      <circle cx="85" cy="135" r="38" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8" stroke-dasharray="12 6" />
      <circle cx="85" cy="135" r="30" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.8" />
      <!-- Center Label -->
      <circle cx="85" cy="135" r="20" fill="#0ea5e9" />
      <circle cx="85" cy="135" r="6" fill="#050811" />
      <!-- Radial Reflection lines on vinyl -->
      <path d="M85 85 L85 105" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" stroke-linecap="round" />
      <path d="M85 165 L85 185" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Tonearm Stylus -->
    <path d="M135 90 L115 110 L100 120" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="135" cy="90" r="4" fill="#94a3b8" />
    <rect x="96" y="118" width="5" height="5" rx="1" fill="#38bdf8" />
  </g>

  <!-- Header with Color Changing Title -->
  <g transform="translate(170, 52)">
    <rect x="0" y="-18" width="85" height="20" rx="10" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="0.8" />
    <text x="42" y="-4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#4ade80" text-anchor="middle">MEDIA SUITE</text>
    <text x="96" y="-4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SYNCHRONIZED ROOM AUDIO</text>

    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="900" fill="url(#titleMedGrad)" letter-spacing="-0.02em">
      YouTube Room Broadcaster &amp; Spotify Integration
    </text>
  </g>

  <!-- Two Column Content Breakdown -->
  <g transform="translate(170, 115)">
    <!-- Column 1: Play From Your YouTube -->
    <g>
      <rect x="0" y="0" width="320" height="116" rx="12" fill="rgba(2, 6, 23, 0.45)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">PLAY FROM YOUR YOUTUBE (PRO)</text>
      
      <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Open recommendations &amp; playlists on YouTube connected to room</text>
      <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Tab stays paused &amp; muted locally; only room hears crystal audio</text>
      <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Floating mini-card on YouTube with spinning disc &amp; queue</text>
      <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• SponsorBlock: auto-skips intro chatter &amp; sponsor segments</text>
    </g>

    <!-- Column 2: Spotify Player Integration -->
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="330" height="116" rx="12" fill="rgba(2, 6, 23, 0.45)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#1ed760">SPOTIFY PLAYER (PRO)</text>
      
      <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Stream your personal Spotify playlists with cover art &amp; search</text>
      <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Auto-resolves songs on YouTube for instant, seamless playback</text>
      <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e2e8f0">• Courtesy yield: pauses when others play, resumes when finished</text>
      <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">✓ Private Tokens: stays on your device, passwords never seen</text>
    </g>
  </g>
</svg>
